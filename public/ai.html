<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agro AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-top: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    footer {
      margin-top: 40px;
      background: #343a40;
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="#">Agro AI</a>
</nav>

<!-- Weather Section -->
<div class="container section">
  <h3>🌦️ Weather Report (No API Key Needed)</h3>
  <form id="weatherForm" class="row g-3">
    <div class="col-md-6">
      <input type="text" id="weatherLocation" class="form-control" placeholder="Enter location" required>
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-primary">Get Weather</button>
    </div>
  </form>
  <div id="weatherResult" class="mt-4"></div>
</div>

<!-- Crop Suggestion Section -->
<div class="container section">
  <h3>🌱 AI Crop Suggestion</h3>
  <form id="cropForm" class="row g-3">
    <div class="col-md-4">
      <input type="text" id="landType" class="form-control" placeholder="Land Type (e.g., Sandy, Loamy)" required>
    </div>
    <div class="col-md-4">
      <select id="waterSource" class="form-select" required>
        <option value="">Select Water Source</option>
        <option>Rain</option>
        <option>Bore</option>
        <option>Canal</option>
      </select>
    </div>
    <div class="col-md-4">
      <select id="produceType" class="form-select" required>
        <option value="">Choose Type</option>
        <option>Vegetables</option>
        <option>Crops</option>
        <option>Fruits</option>
        <option>Flowers</option>
      </select>
    </div>
    <div class="col-md-12">
      <input type="text" id="extraInfo" class="form-control" placeholder="Any specific crop or info (optional)">
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-success">Get Suggestion</button>
    </div>
  </form>
  <div id="cropResult" class="mt-4"></div>
</div>

<footer>
  &copy; 2025 Agro AI | Powered by OpenAI & wttr.in
</footer>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const openaiApiKey = "YOUR_OPENAI_API_KEY"; // ⚠️ Replace with your OpenAI Key

  // WEATHER SECTION (wttr.in API)
  document.getElementById("weatherForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const location = document.getElementById("weatherLocation").value;
    const resultBox = document.getElementById("weatherResult");
    resultBox.innerHTML = "Loading weather...";

    const url = `https://wttr.in/${location}?format=j1`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      const current = data.current_condition[0];
      const weatherDesc = current.weatherDesc[0].value;
      const humidity = current.humidity;
      const temp = current.temp_C;
      const wind = current.windspeedKmph;

      resultBox.innerHTML = `
        <div class="card">
          <div class="card-body">
            <h5>Location: ${location}</h5>
            <p><strong>Temperature:</strong> ${temp}°C</p>
            <p><strong>Condition:</strong> ${weatherDesc}</p>
            <p><strong>Humidity:</strong> ${humidity}%</p>
            <p><strong>Wind Speed:</strong> ${wind} km/h</p>
          </div>
        </div>
      `;
    } catch (err) {
      resultBox.innerHTML = `<div class="alert alert-danger">Unable to fetch weather.</div>`;
    }
  });

  // CROP SUGGESTION
  document.getElementById("cropForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const land = document.getElementById("landType").value;
    const water = document.getElementById("waterSource").value;
    const type = document.getElementById("produceType").value;
    const extra = document.getElementById("extraInfo").value;
    const cropBox = document.getElementById("cropResult");

    cropBox.innerHTML = "Thinking...";

    const prompt = `Suggest the best ${type} to grow in ${land} land with ${water} water source. ${extra ? "Extra info: " + extra : ""}`;

    try {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${openaiApiKey}`
        },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.7
        })
      });

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content;

      cropBox.innerHTML = `
        <div class="alert alert-info">
          <strong>AI Suggestion:</strong><br>${reply.replace(/\n/g, "<br>")}
        </div>
      `;
    } catch (err) {
      cropBox.innerHTML = `<div class="alert alert-danger">Failed to get suggestion.</div>`;
    }
  });
</script>

</body>
</html>
